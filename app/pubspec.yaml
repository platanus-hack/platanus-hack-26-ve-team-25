name: casa
description: "App del teléfono de la casa: escucha, pregunta «¿Está bien?» y avisa a la familia."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_phone_direct_caller: ^2.2.1
  http: ^1.6.0
  permission_handler: ^12.0.1
  record: ^7.1.2
  speech_to_text: ^7.5.0
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # YAMNet (Apache 2.0, de tensorflow/models) y sus 521 etiquetas
  assets:
    - assets/modelos/yamnet.tflite
    - assets/modelos/yamnet_class_map.csv

  # La fuente va dentro de la app: tiene que verse bien sin internet.
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fuentes/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fuentes/AtkinsonHyperlegible-Bold.ttf
          weight: 700

# El ícono de la app, de la marca (marca/presente-icono-cuadrado.svg pasado a PNG). Se regenera con
# `dart run flutter_launcher_icons`. En el adaptable, la herramienta deja un margen del 16 % para
# que Android no le recorte la casa con su círculo o su gota.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icono/icono.png
  adaptive_icon_background: "#141B2E"
  adaptive_icon_foreground: assets/icono/icono.png
  min_sdk_android: 24
