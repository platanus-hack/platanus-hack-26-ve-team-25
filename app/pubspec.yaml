name: casa
description: "App del teléfono de la casa: escucha, pregunta «¿Está bien?» y avisa a la familia."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_phone_direct_caller: ^2.2.1
  permission_handler: ^12.0.1
  record: ^7.1.2
  speech_to_text: ^7.5.0
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # YAMNet (Apache 2.0, de tensorflow/models) y sus 521 etiquetas
  assets:
    - assets/modelos/yamnet.tflite
    - assets/modelos/yamnet_class_map.csv

  # La fuente va dentro de la app: tiene que verse bien sin internet.
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fuentes/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fuentes/AtkinsonHyperlegible-Bold.ttf
          weight: 700
